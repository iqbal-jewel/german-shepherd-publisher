name: Reel render check (no posting)

on:
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Render sample Reels
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: python tools/render_test.py
      - uses: actions/upload-artifact@v4
        with:
          name: sample-reels
          path: out/*.mp4
