name: Auto Publish to Facebook & Instagram

on:
  schedule:
    # Every 5 minutes (GitHub's minimum). GitHub often delays or skips scheduled runs, so the job
    # catches up on anything due: each run posts at most one due item, oldest first.
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

# Never let two runs overlap: overlapping runs are what causes duplicate posts.
concurrency:
  group: auto-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run publishing job
        env:
          META_PAGE_ACCESS_TOKEN: ${{ secrets.META_PAGE_ACCESS_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          IG_ACCOUNT_ID: ${{ secrets.IG_ACCOUNT_ID }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          ffmpeg -version | head -1
          python publish_job.py

      # always(): the queue must be saved even when the job above exits with an error,
      # otherwise the next run would not know what was already posted.
      - name: Commit updated content queue
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add content_queue.json
          if git diff --staged --quiet; then
            echo "Queue unchanged."
            exit 0
          fi
          git commit -m "chore: update published queue"
          for attempt in 1 2 3 4; do
            if git pull --rebase -X theirs origin main && git push origin main; then
              exit 0
            fi
            echo "Push attempt $attempt failed, retrying..."
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 5))
          done
          echo "Could not save the queue after 4 attempts."
          exit 1
